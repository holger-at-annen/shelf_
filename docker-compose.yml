version: '3.8'

services:
  # 1. Official Shelf Application UI
  app:
    image: ghcr.io/shelf-nu/shelf.nu:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
      supabase-init:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgres://postgres:$$SERVICE_PASSWORD_DB@db:5432/postgres
      - NEXT_PUBLIC_SUPABASE_URL=https://${COOLIFY_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=$$SERVICE_PASSWORD_ANON
      - SUPABASE_SERVICE_ROLE_KEY=$$SERVICE_PASSWORD_SERVICE
      - NEXTAUTH_SECRET=$$SERVICE_PASSWORD_NEXTAUTH
      - NEXTAUTH_URL=https://${COOLIFY_URL}
    # This automatically pushes migrations on startup if the DB is blank
    command: sh -c "npx prisma db push && node server.js"
    labels:
      - "coolify.managed=true"

  # 2. Official PostgreSQL Database Engine
  db:
    image: supabase/postgres:15.1.1.78
    restart: always
    volumes:
      - shelf_db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=$$SERVICE_PASSWORD_DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Official Supabase GoTrue Auth
  auth:
    image: supabase/gotrue:v2.196.0
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DATABASE_URL=postgres://postgres:$$SERVICE_PASSWORD_DB@db:5432/postgres
      - GOTRUE_SITE_URL=https://${COOLIFY_URL}
      - GOTRUE_JWT_SECRET=$$SERVICE_PASSWORD_JWT
      - GOTRUE_JWT_EXP=3600
      - GOTRUE_EXTERNAL_EMAIL_ENABLED=true
      - GOTRUE_SMTP_HOST=${SMTP_HOST}
      - GOTRUE_SMTP_PORT=${SMTP_PORT:-587}
      - GOTRUE_SMTP_USER=${SMTP_USER}
      - GOTRUE_SMTP_PASS=${SMTP_PASSWORD}
      - GOTRUE_SMTP_ADMIN_EMAIL=${SMTP_FROM_ADDRESS}

  # 4. Official Supabase Storage API
  storage:
    image: supabase/storage-api:v0.43.0
    restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - shelf_storage_data:/var/lib/storage
    environment:
      - ANON_KEY=$$SERVICE_PASSWORD_ANON
      - SERVICE_KEY=$$SERVICE_PASSWORD_SERVICE
      - DB_CONN_STR=postgres://postgres:$$SERVICE_PASSWORD_DB@db:5432/postgres
      - JWT_SECRET=$$SERVICE_PASSWORD_JWT
      - STORAGE_BACKEND=file
      - FILE_STORAGE_BACKEND_PATH=/var/lib/storage

  # 5. Official Kong Gateway Proxy
  kong:
    image: kong:2.8.1-alpine
    restart: always
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/etc/kong/kong.yml
    volumes:
      - ./kong.yml:/etc/kong/kong.yml:ro

  # 6. Automated One-Time Init Setup Container (Only runs bucket logic now)
  supabase-init:
    image: postgres:15-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./init-scripts:/init-scripts:ro
    environment:
      - PGPASSWORD=$$SERVICE_PASSWORD_DB
    command: >
      sh -c "
        echo 'Seeding Required Supabase Storage Buckets...' &&
        psql -h db -U postgres -d postgres -f /init-scripts/buckets.sql &&
        echo 'Storage structure initialization complete!'
      "

volumes:
  shelf_db_data:
    name: shelf_db_data
  shelf_storage_data:
    name: shelf_storage_data
