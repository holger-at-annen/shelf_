version: '3.8'

services:
  # 1. Official Shelf Application UI
  app:
    image: ghcr.io/shelf-nu/shelf.nu:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://postgres:${SERVICE_PASSWORD_DB}@db:5432/postgres"
      SESSION_SECRET: "${SERVICE_PASSWORD_NEXTAUTH}"
      INVITE_TOKEN_SECRET: "${SERVICE_PASSWORD_NEXTAUTH}"
      SUPABASE_ANON_PUBLIC: "${SERVICE_PASSWORD_ANON}"
      SUPABASE_SERVICE_ROLE: "${SERVICE_PASSWORD_SERVICE}"
      # Direktverweise über die eigenen Subdomains (kein Loopback-Problem mehr)
      SUPABASE_URL: "${SHELF_AUTH_URL}"
      SERVER_URL: "${CUSTOM_SHELF_URL}"
      PGPASSWORD: "${SERVICE_PASSWORD_DB}"
      MAPTILER_TOKEN: "placeholder_token"
      SMTP_HOST: "localhost"
      SMTP_PORT: "587"
      SMTP_USER: "placeholder"
      SMTP_PWD: "placeholder"
      SMTP_FROM: "noreply@example.com"
    command: >
      sh -c "
        npx prisma db push &&
        sleep 3 &&
        psql -h db -U postgres -d postgres -c \"CREATE SCHEMA IF NOT EXISTS storage; INSERT INTO storage.buckets (id, name, public) VALUES ('assets', 'assets', true) ON CONFLICT (id) DO NOTHING;\" &&
        node server.js
      "
    labels:
      - "coolify.managed=true"
      - "coolify.port=8080"  # Coolify leitet den Traffic direkt an die App weiter

  # 2. Official PostgreSQL Database Engine
  db:
    image: supabase/postgres:15.1.1.78
    restart: always
    volumes:
      - shelf_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: "${SERVICE_PASSWORD_DB}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Official Supabase GoTrue Auth
  auth:
    image: supabase/gotrue:v2.196.0
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: "postgres"
      DATABASE_URL: "postgres://postgres:${SERVICE_PASSWORD_DB}@db:5432/postgres"
      GOTRUE_DATABASE_URL: "postgres://postgres:${SERVICE_PASSWORD_DB}@db:5432/postgres"
      GOTRUE_SITE_URL: "${CUSTOM_SHELF_URL}"
      GOTRUE_JWT_SECRET: "${SERVICE_PASSWORD_JWT}"
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      API_EXTERNAL_URL: "${SHELF_AUTH_URL}"
    labels:
      - "coolify.managed=true"
      - "coolify.port=9999"  # Coolify leitet Auth-Traffic direkt an den Auth-Container weiter

  # 4. Official Supabase Storage API
  storage:
    image: supabase/storage-api:v0.43.0
    restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - shelf_storage_data:/var/lib/storage
    environment:
      ANON_KEY: "${SERVICE_PASSWORD_ANON}"
      SERVICE_KEY: "${SERVICE_PASSWORD_SERVICE}"
      DB_CONN_STR: "postgres://postgres:${SERVICE_PASSWORD_DB}@db:5432/postgres"
      DATABASE_URL: "postgres://postgres:${SERVICE_PASSWORD_DB}@db:5432/postgres"
      JWT_SECRET: "${SERVICE_PASSWORD_JWT}"
      PGRST_JWT_SECRET: "${SERVICE_PASSWORD_JWT}"
      STORAGE_BACKEND: "file"
      FILE_STORAGE_BACKEND_PATH: "/var/lib/storage"
      FILE_SIZE_LIMIT: "52428800"
      GLOBAL_S3_BUCKET: "stub-bucket"
      REGION: "eu-central-1"
      TENANT_ID: "stub-tenant"
    labels:
      - "coolify.managed=true"
      - "coolify.port=5000"

volumes:
  shelf_db_data:
    name: shelf_db_data
  shelf_storage_data:
    name: shelf_storage_data
